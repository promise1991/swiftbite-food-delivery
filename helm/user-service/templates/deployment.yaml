apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }}
      containers:
        - name: user-service
          image: "{{ .Values.global.imageRegistry }}/user-service:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
