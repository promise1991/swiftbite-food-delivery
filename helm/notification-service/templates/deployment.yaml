apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }}
      containers:
        - name: notification-service
          image: "{{ .Values.global.imageRegistry }}/notification-service:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8010
          env:
            - name: PORT
              value: "8010"
