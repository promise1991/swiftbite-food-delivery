apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restaurant-service
  template:
    metadata:
      labels:
        app: restaurant-service
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }}
      containers:
        - name: restaurant-service
          image: "{{ .Values.global.imageRegistry }}/restaurant-service:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8007
          env:
            - name: PORT
              value: "8007"
