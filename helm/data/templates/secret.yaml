apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  labels: { app.kubernetes.io/part-of: swiftbite }
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.superuserPassword | quote }}
  {{- range $name, $db := .Values.databases }}
  {{ upper $name }}_DB_USER: {{ printf "%s_user" $name | quote }}
  {{ upper $name }}_DB_PASSWORD: {{ $db.password | quote }}
  {{ upper $name }}_DATABASE_URL: {{ printf "postgresql://%s_user:%s@postgres:5432/%sdb" $name $db.password $name | quote }}
  {{- end }}
