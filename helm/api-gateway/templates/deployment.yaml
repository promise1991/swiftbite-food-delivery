apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }}
      containers:
        - name: api-gateway
          image: "{{ .Values.global.imageRegistry }}/api-gateway:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
