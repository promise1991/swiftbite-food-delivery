apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }}
      containers:
        - name: search-service
          image: "{{ .Values.global.imageRegistry }}/search-service:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8008
          env:
            - name: PORT
              value: "8008"
