apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      labels:
        app: delivery-service
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }}
      containers:
        - name: delivery-service
          image: "{{ .Values.global.imageRegistry }}/delivery-service:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8012
          env:
            - name: PORT
              value: "8012"
