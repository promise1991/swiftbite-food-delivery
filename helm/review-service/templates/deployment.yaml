apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }}
      containers:
        - name: review-service
          image: "{{ .Values.global.imageRegistry }}/review-service:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8011
          env:
            - name: PORT
              value: "8011"
