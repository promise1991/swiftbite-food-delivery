apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }}
      containers:
        - name: auth-service
          image: "{{ .Values.global.imageRegistry }}/auth-service:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              value: "8001"
