apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }}
      containers:
        - name: order-service
          image: "{{ .Values.global.imageRegistry }}/order-service:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8005
          env:
            - name: PORT
              value: "8005"
