apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }}
      containers:
        - name: analytics-service
          image: "{{ .Values.global.imageRegistry }}/analytics-service:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8013
          env:
            - name: PORT
              value: "8013"
