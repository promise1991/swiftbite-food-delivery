apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }}
      containers:
        - name: payment-service
          image: "{{ .Values.global.imageRegistry }}/payment-service:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8006
          env:
            - name: PORT
              value: "8006"
