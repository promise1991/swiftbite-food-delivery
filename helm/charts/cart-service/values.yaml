image:
  repository: cart-service   # full image = <global.image.registry>/<repository>:<tag>
  tag: ""                        # empty = global.image.tag
replicaCount: 1                  # keep at 1: state is in memory
service:
  type: ClusterIP
  port: 8003
probes:
  liveness: /health
  readiness: /ready
env:
  REDIS_URL: redis://redis:6379/0
resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { cpu: 300m, memory: 256Mi }
