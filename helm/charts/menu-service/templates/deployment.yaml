apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: swiftbite
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: swiftbite
    spec:
      {{- $ips := (.Values.global | default dict).imagePullSecrets }}
      {{- if $ips }}
      imagePullSecrets:
        {{- range (kindIs "string" $ips | ternary (list $ips) $ips) }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "svc.image" . }}
          imagePullPolicy: {{ include "svc.pullPolicy" . }}
          ports:
            - containerPort: {{ .Values.service.port }}
          {{- if or .Values.env .Values.rabbit .Values.gateway .Values.database }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.gateway }}
            # nginx's resolver ignores search domains, so it needs the full service name
            - name: API_GATEWAY_URL
              value: "http://{{ .Values.gateway.name }}.{{ .Release.Namespace }}.svc.{{ (.Values.global | default dict).clusterDomain | default "cluster.local" }}:{{ .Values.gateway.port }}"
            {{- end }}
            {{- if .Values.database }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            {{- end }}
            {{- if .Values.rabbit }}
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbit.secretName }}
                  key: RABBITMQ_URL
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet: { path: {{ .Values.probes.readiness }}, port: {{ .Values.service.port }} }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: {{ .Values.probes.liveness }}, port: {{ .Values.service.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
