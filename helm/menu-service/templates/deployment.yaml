apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: menu-service
  template:
    metadata:
      labels:
        app: menu-service
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets }}
      containers:
        - name: menu-service
          image: "{{ .Values.global.imageRegistry }}/menu-service:{{ .Values.global.imageTag }}"
          ports:
            - containerPort: 8009
          env:
            - name: PORT
              value: "8009"
