# RBAC least-privilege - each service fit only read its own ConfigMap/Secret
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swiftbite-sa
  namespace: swiftbitens
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: swiftbite-role
  namespace: swiftbitens
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: swiftbite-binding
  namespace: swiftbitens
subjects:
- kind: ServiceAccount
  name: swiftbite-sa
  namespace: swiftbitens
roleRef:
  kind: Role
  name: swiftbite-role
  apiGroup: rbac.authorization.k8s.io
