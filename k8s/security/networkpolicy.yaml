# NetworkPolicies - only gateway fit talk to services, only order fit talk to Postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: swiftbitens
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-services
  namespace: swiftbitens
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
        matchLabels:
          app: api-gateway
    ports:
        - port: 8005
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-gateway
  namespace: swiftbitens
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
        matchLabels:
          app: frontend
    ports:
        - port: 8000
